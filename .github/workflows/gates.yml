name: gates

# The four gates in AGENTS.md are the definition of done. Running them here
# takes every human and agent summary out of the trust path: a red check on the
# PR cannot be talked around.
on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: install playwright browsers
        run: npx playwright install --with-deps chromium

      - name: migrate and seed
        run: |
          npm run db:migrate
          node scripts/seed.ts

      # One runner for all four so a failure cannot be lost in a pipeline exit
      # code. It prints a verdict block last and exits non-zero on any failure.
      - name: run the four gates
        run: node scripts/gates.mjs

      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
